openapi: 3.0.3
info:
  title: Fresas con Crema API
  description: Contrato de la API del punto de venta de Fresas con Crema
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: Servidor local de desarrollo

tags:
  - name: Auth
  - name: Usuarios
  - name: Productos
  - name: Insumos
  - name: Recetas
  - name: Ventas
  - name: Inventario
  - name: CorteCaja
  - name: Sync

paths:

  # ---------- AUTH ----------
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, password]
              properties:
                correo: { type: string, example: "esposa@fresas.com" }
                password: { type: string, example: "12345678" }
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  usuario: { $ref: "#/components/schemas/Usuario" }
        "401":
          description: Credenciales inválidas

  # ---------- USUARIOS ----------
  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Usuario" }
    post:
      tags: [Usuarios]
      summary: Crear usuario
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioInput" }
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }

  /usuarios/{id}:
    put:
      tags: [Usuarios]
      summary: Editar usuario
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioInput" }
      responses:
        "200":
          description: Usuario actualizado
    delete:
      tags: [Usuarios]
      summary: Desactivar usuario (borrado lógico)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "204":
          description: Usuario desactivado

  # ---------- PRODUCTOS ----------
  /productos:
    get:
      tags: [Productos]
      summary: Listar productos (solo activos por defecto)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: incluirInactivos
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Producto" }
    post:
      tags: [Productos]
      summary: Crear producto
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductoInput" }
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Producto" }

  /productos/{id}:
    get:
      tags: [Productos]
      summary: Obtener producto por id
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Producto encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Producto" }
    put:
      tags: [Productos]
      summary: Editar producto
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductoInput" }
      responses:
        "200":
          description: Producto actualizado
    delete:
      tags: [Productos]
      summary: Desactivar producto (borrado lógico)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "204":
          description: Producto desactivado

  # ---------- INSUMOS ----------
  /insumos:
    get:
      tags: [Insumos]
      summary: Listar insumos
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista de insumos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Insumo" }
    post:
      tags: [Insumos]
      summary: Crear insumo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InsumoInput" }
      responses:
        "201":
          description: Insumo creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Insumo" }

  /insumos/{id}:
    put:
      tags: [Insumos]
      summary: Editar insumo
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InsumoInput" }
      responses:
        "200":
          description: Insumo actualizado
    delete:
      tags: [Insumos]
      summary: Eliminar insumo
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "204":
          description: Insumo eliminado

  /insumos/{id}/movimientos:
    get:
      tags: [Inventario]
      summary: Historial de movimientos de un insumo
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Lista de movimientos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MovimientoInventario" }

  # ---------- RECETAS ----------
  /productos/{id}/receta:
    get:
      tags: [Recetas]
      summary: Obtener la receta (insumos requeridos) de un producto
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Lista de items de receta
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecetaItem" }
    post:
      tags: [Recetas]
      summary: Agregar un insumo a la receta del producto
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecetaItemInput" }
      responses:
        "201":
          description: Item de receta creado

  /recetas/{id}:
    put:
      tags: [Recetas]
      summary: Editar cantidad requerida de un item de receta
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecetaItemInput" }
      responses:
        "200":
          description: Item de receta actualizado
    delete:
      tags: [Recetas]
      summary: Quitar un insumo de la receta
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "204":
          description: Item de receta eliminado

  # ---------- VENTAS ----------
  /ventas:
    get:
      tags: [Ventas]
      summary: Listar ventas (filtrable por fecha y usuario)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: fecha
          in: query
          schema: { type: string, format: date }
        - name: usuarioId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Lista de ventas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Venta" }
    post:
      tags: [Ventas]
      summary: Registrar una venta (descuenta inventario automáticamente vía receta)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VentaInput" }
      responses:
        "201":
          description: Venta registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venta" }
        "409":
          description: Stock insuficiente de algún insumo

  /ventas/{id}:
    get:
      tags: [Ventas]
      summary: Obtener detalle de una venta
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Venta con su detalle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venta" }

  # ---------- INVENTARIO (ajuste manual) ----------
  /movimientos-inventario:
    post:
      tags: [Inventario]
      summary: Registrar ajuste manual de inventario
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MovimientoInventarioInput" }
      responses:
        "201":
          description: Movimiento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovimientoInventario" }

  # ---------- CORTE DE CAJA ----------
  /cortes-caja/apertura:
    post:
      tags: [CorteCaja]
      summary: Abrir turno (registra fondo de caja inicial)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fondoApertura]
              properties:
                fondoApertura: { type: number, example: 200.00 }
      responses:
        "201":
          description: Corte abierto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorteCaja" }

  /cortes-caja/{id}/cierre:
    put:
      tags: [CorteCaja]
      summary: Cerrar turno (registra conteo físico y calcula diferencia)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totalContadoCierre]
              properties:
                totalContadoCierre: { type: number, example: 850.00 }
                nota: { type: string, example: "Faltaron $20, no se sabe por qué" }
      responses:
        "200":
          description: Corte cerrado con diferencia calculada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorteCaja" }

  /cortes-caja:
    get:
      tags: [CorteCaja]
      summary: Listar cortes de caja (filtrable por fecha y usuario)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: fecha
          in: query
          schema: { type: string, format: date }
        - name: usuarioId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Lista de cortes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CorteCaja" }

  /cortes-caja/resumen:
    get:
      tags: [CorteCaja]
      summary: Resumen del día (suma todos los cortes de esa fecha)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: fecha
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Totales agregados del día
          content:
            application/json:
              schema:
                type: object
                properties:
                  fecha: { type: string, format: date }
                  totalSistemaEfectivo: { type: number }
                  totalSistemaTransferencia: { type: number }
                  totalContado: { type: number }
                  diferenciaTotal: { type: number }
                  cortes:
                    type: array
                    items: { $ref: "#/components/schemas/CorteCaja" }

  # ---------- SYNC ----------
  /sync/batch:
    post:
      tags: [Sync]
      summary: Sube un lote de registros pendientes generados offline
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                registros:
                  type: array
                  items:
                    type: object
                    properties:
                      tablaAfectada: { type: string, example: "venta" }
                      registroId: { type: string, format: uuid }
                      payload: { type: object }
      responses:
        "200":
          description: Resultado de la sincronización por registro
          content:
            application/json:
              schema:
                type: object
                properties:
                  aplicados: { type: array, items: { type: string, format: uuid } }
                  fallidos: { type: array, items: { type: string, format: uuid } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    idPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        correo: { type: string }
        rol: { type: string, enum: [dueño, empleado] }
        activo: { type: boolean }

    UsuarioInput:
      type: object
      required: [nombre, correo, password, rol]
      properties:
        nombre: { type: string }
        correo: { type: string }
        password: { type: string }
        rol: { type: string, enum: [dueño, empleado] }

    Producto:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        precio: { type: number }
        categoria: { type: string }
        activo: { type: boolean }

    ProductoInput:
      type: object
      required: [nombre, precio]
      properties:
        nombre: { type: string, example: "Fresas con crema chica" }
        precio: { type: number, example: 45.00 }
        categoria: { type: string, example: "chica" }

    Insumo:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        unidad: { type: string }
        stockActual: { type: number }

    InsumoInput:
      type: object
      required: [nombre, unidad, stockActual]
      properties:
        nombre: { type: string, example: "Fresa" }
        unidad: { type: string, example: "kg" }
        stockActual: { type: number, example: 10.5 }

    RecetaItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        productoId: { type: string, format: uuid }
        insumoId: { type: string, format: uuid }
        insumoNombre: { type: string }
        cantidadRequerida: { type: number }

    RecetaItemInput:
      type: object
      required: [insumoId, cantidadRequerida]
      properties:
        insumoId: { type: string, format: uuid }
        cantidadRequerida: { type: number, example: 0.15 }

    Venta:
      type: object
      properties:
        id: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        fechaHora: { type: string, format: date-time }
        total: { type: number }
        metodoPago: { type: string, enum: [efectivo, transferencia] }
        detalle:
          type: array
          items: { $ref: "#/components/schemas/DetalleVenta" }

    DetalleVenta:
      type: object
      properties:
        productoId: { type: string, format: uuid }
        productoNombre: { type: string }
        cantidad: { type: integer }
        precioUnitario: { type: number }

    VentaInput:
      type: object
      required: [metodoPago, items]
      properties:
        metodoPago: { type: string, enum: [efectivo, transferencia] }
        items:
          type: array
          items:
            type: object
            required: [productoId, cantidad]
            properties:
              productoId: { type: string, format: uuid }
              cantidad: { type: integer, example: 2 }

    MovimientoInventario:
      type: object
      properties:
        id: { type: string, format: uuid }
        insumoId: { type: string, format: uuid }
        ventaId: { type: string, format: uuid, nullable: true }
        tipo: { type: string, enum: [entrada, salida] }
        cantidad: { type: number }
        origen: { type: string, enum: [venta_automatica, ajuste_manual, compra, merma] }
        nota: { type: string, nullable: true }
        fecha: { type: string, format: date-time }

    MovimientoInventarioInput:
      type: object
      required: [insumoId, tipo, cantidad, origen]
      properties:
        insumoId: { type: string, format: uuid }
        tipo: { type: string, enum: [entrada, salida] }
        cantidad: { type: number, example: 5 }
        origen: { type: string, enum: [ajuste_manual, compra, merma], example: "compra" }
        nota: { type: string, example: "Compra semanal de fresa" }

    CorteCaja:
      type: object
      properties:
        id: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        fecha: { type: string, format: date }
        fondoApertura: { type: number }
        totalSistemaEfectivo: { type: number }
        totalSistemaTransferencia: { type: number }
        totalContadoCierre: { type: number, nullable: true }
        diferencia: { type: number, nullable: true }
        nota: { type: string, nullable: true }
        estado: { type: string, enum: [abierto, cerrado] }
